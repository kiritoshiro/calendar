name: Calendar CodeQL configuration

# CodeQL has no PHP analyser, so it covers the JavaScript this plugin ships and
# the workflows that build and publish it. PHP is handled by PHPStan, PHPCS and
# Semgrep in the static analysis workflow.
#
# security-extended, not security-and-quality: the quality queries only ever
# reported style notes in upstream Modern Events Calendar code that this fork
# does not edit (80 alerts, see docs/code-scanning-triage.md).
queries:
  - uses: security-extended

paths-ignore:
  # Minified bundles analyse poorly and are not edited here.
  - '**/*.min.js'
  - '**/*.pkgd.js'
  - 'renginiu-kalendorius/assets/js/date.format.min.js'
  # Third-party libraries shipped as is (featherlight, marker clusterer, ...).
  - 'renginiu-kalendorius/assets/packages/**'
  # Bundles a full copy of jQuery ahead of the countdown code.
  - 'renginiu-kalendorius/assets/js/flipcount-divi.js'
