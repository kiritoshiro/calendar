name: Cybersecurity baseline
'on':
  pull_request: null
  schedule:
  - cron: 28 6 * * 2
  workflow_dispatch: null
  workflow_call: null
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: cybersecurity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Cybersecurity baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Install checksum-verified TruffleHog
      if: ${{ !cancelled() }}
      shell: bash
      run: 'set -euo pipefail

        curl --fail --silent --show-error --location --retry 3 https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.9/trufflehog_3.97.9_linux_amd64.tar.gz
        --output "$RUNNER_TEMP/trufflehog.tar.gz"

        printf ''%s  %s\n'' ''40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866'' "$RUNNER_TEMP/trufflehog.tar.gz"
        | sha256sum --check --strict

        tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$RUNNER_TEMP" trufflehog'
    - name: Secrets (TruffleHog, no verification)
      if: ${{ !cancelled() }}
      env:
        SCAN_BASE: ${{ github.event.pull_request.base.sha }}
        SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        TRUFFLEHOG_PATH: ${{ runner.temp }}/trufflehog
      run: python .github/security/secrets_scan.py
    - name: Workflow syntax (actionlint)
      if: ${{ !cancelled() }}
      shell: bash
      run: 'set -euo pipefail

        curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        --output "$RUNNER_TEMP/actionlint.tar.gz"

        printf ''%s  %s\n'' ''8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'' "$RUNNER_TEMP/actionlint.tar.gz"
        | sha256sum --check --strict

        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

        "$RUNNER_TEMP/actionlint" -color'
