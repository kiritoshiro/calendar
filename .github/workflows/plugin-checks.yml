name: Security and quality checks

# Reusable: runs only through security-gate.yml, which owns the triggers,
# schedule and concurrency.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  code-quality:
    name: PHP 8.4 and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Lint all plugin PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find modern-events-calendar-lite -type f -name '*.php' -print0)
          if (( ${#php_files[@]} == 0 )); then
            echo 'No plugin PHP files were found.'
            exit 1
          fi
          echo "Checking ${#php_files[@]} PHP files with PHP 8.4"
          for file in "${php_files[@]}"; do
            php -l "$file" >/dev/null
          done

      - name: Verify fork customizations
        run: node tests/verify-customizations.js

      - name: Check customized JavaScript syntax
        run: |
          node --check modern-events-calendar-lite/assets/js/frontend.js
          node --check tests/verify-customizations.js
          node --check tests/build-magenda-css.js

      - name: Check the trimmed magenda stylesheet is up to date
        run: node tests/build-magenda-css.js --check

      - name: Validate WPML XML configuration
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('modern-events-calendar-lite/wpml-config.xml')"

      - name: Reject unresolved merge conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^[[:space:]]*(<<<<<<< .+|=======|>>>>>>> .+)[[:space:]]*$' -- '*.php' '*.js' '*.css' '*.xml' '*.json' '*.yml' '*.yaml'; then
            echo 'Unresolved merge conflict markers detected.'
            exit 1
          fi

  repository-security:
    name: Vulnerabilities, secrets and misconfiguration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy repository security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          version: v0.74.0

  wordpress-security:
    name: WordPress Plugin Check security review (legacy baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The imported upstream tree carries thousands of findings, so the
      # official check always reports some. Its outcome alone is not the gate;
      # the baseline comparison below fails only on findings a change adds.
      - name: Run official WordPress Plugin Check security checks
        id: wordpress-check
        continue-on-error: true
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./modern-events-calendar-lite
          categories: security

      - name: Compare with the legacy baseline
        shell: bash
        run: python3 .github/linters/plugin-check-baseline.py "$RUNNER_TEMP/plugin-check-results.txt" .github/linters/plugin-check-baseline.json
