name: Build and publish slim plugin ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Keep ./ for the reusable workflows until actionlint accepts $/
  # (rhysd/actionlint#711); job-level calls already run the caller's commit.
  cybersecurity:
    permissions:
      contents: read
    uses: ./.github/workflows/cybersecurity.yml # zizmor: ignore[self-repository]
  security-and-regression:
    permissions:
      contents: read
    uses: ./.github/workflows/plugin-checks.yml # zizmor: ignore[self-repository]
  package:
    permissions:
      contents: write
    needs: [cybersecurity, security-and-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node tests/verify-customizations.js
      - name: Read plugin version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' modern-events-calendar-lite/modern-events-calendar-lite.php | head -n1 | tr -d '\r')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=modern-events-calendar-lite-$version.zip" >> "$GITHUB_OUTPUT"
      - name: Build calendar-only package
        shell: bash
        env:
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/mec-package"
          mkdir -p "$stage/modern-events-calendar-lite"
          rsync -a             --exclude='app/api/Twilio/'             --exclude='app/api/TFPDF/'             --exclude='app/api/Stripe/'             --exclude='app/api/Campaign_Monitor/'             --exclude='app/api/Meetup/'             --exclude='app/api/addons-api/'             --exclude='assets/img/skins/'             --exclude='assets/css/*rtl*.css'             --exclude='app/features/appointments.php'             --exclude='app/features/attendees.php'             --exclude='app/features/autoemails.php'             --exclude='app/features/bookingcalendar.php'             --exclude='app/features/cart.php'             --exclude='app/features/certificates.php'             --exclude='app/features/notifications.php'             --exclude='app/features/profile.php'             --exclude='app/features/sms.php'             --exclude='app/features/wc.php'             --exclude='app/features/webhooks.php'             --exclude='app/features/booking/'             --exclude='app/features/cart/'             --exclude='app/features/profile/'             --exclude='app/features/certificates/'             --exclude='app/modules/booking/'             --exclude='app/modules/attendees-list/'             --exclude='app/modules/progress-bar/'             --exclude='app/modules/qrcode/'             --exclude='app/features/mec/addons.php'             --exclude='app/features/mec/go-pro.php'             --exclude='app/features/mec/wizard.php'             --exclude='app/features/ix/export.php'             --exclude='app/features/ix/import.php'             --exclude='app/features/ix/import_f_calendar.php'             --exclude='app/features/ix/import_meetup.php'             --exclude='app/features/ix/thirdparty.php'             --exclude='app/features/ix/test_data.php'             --exclude='assets/img/dp-dsb-support.jpg'             --exclude='assets/img/dp-dsb-support2.png'             --exclude='assets/img/mec-addons-teaser1.png'             --exclude='assets/img/mec-lite-backend-go-pro.png'             --exclude='assets/img/support.png'             --exclude='MEC-Installation-Guide.pdf'             --exclude='assets/css/frontend.css'             --exclude='assets/css/backend.css'             --exclude='assets/css/a11y.css'             --exclude='assets/css/a11y-backend.css'             --exclude='languages/'             modern-events-calendar-lite/ "$stage/modern-events-calendar-lite/"
          mkdir -p "$stage/modern-events-calendar-lite/languages"
          cp modern-events-calendar-lite/languages/index.html "$stage/modern-events-calendar-lite/languages/"
          cp modern-events-calendar-lite/languages/modern-events-calendar-lite-en_US.* "$stage/modern-events-calendar-lite/languages/"
          cp modern-events-calendar-lite/languages/modern-events-calendar-lite-ru_RU.* "$stage/modern-events-calendar-lite/languages/"
          cp modern-events-calendar-lite/languages/modern-events-calendar-lite-lt_LT.po "$stage/modern-events-calendar-lite/languages/"
          test -f "$stage/modern-events-calendar-lite/app/api/Google/autoload.php"
          test ! -e "$stage/modern-events-calendar-lite/app/api/Twilio"
          test ! -e "$stage/modern-events-calendar-lite/app/core/puc"
          test -s "$stage/modern-events-calendar-lite/app/api/XLSX/xlsxwriter.class.php"
          test ! -e "$stage/modern-events-calendar-lite/assets/css/frontend.css"
          test -s "$stage/modern-events-calendar-lite/assets/css/frontend.min.css"
          test -s "$stage/modern-events-calendar-lite/assets/css/backend.min.css"
          test -s "$stage/modern-events-calendar-lite/assets/css/a11y.min.css"
          for removed in \
            app/features/mec/wizard.php \
            app/features/ix/export.php \
            app/features/ix/import.php \
            app/features/ix/import_f_calendar.php \
            app/features/ix/import_meetup.php \
            app/features/ix/thirdparty.php \
            app/features/ix/test_data.php; do
            test ! -e "$stage/modern-events-calendar-lite/$removed"
          done
          cd "$stage"
          zip -qr "$GITHUB_WORKSPACE/$ARCHIVE" modern-events-calendar-lite
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modern-events-calendar-lite-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish updater release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Never replace a published package: sites that already installed
            # this version would keep different code under the same number.
            echo "::notice::$tag is already released; its package is left unchanged. Bump the plugin version to publish this commit."
          else
            gh release create "$tag" "$ARCHIVE" --title "Calendar $VERSION" --notes "Slim adventistai.lt calendar build with Google Calendar integration."
          fi
