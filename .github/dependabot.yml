version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 05:00
    timezone: Europe/Vilnius
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - security
  commit-message:
    prefix: ci
  cooldown:
    default-days: 7
- package-ecosystem: composer
  directory: /.github/linters
  # WPCS 3.x (and PHPCompatibilityWP) only support PHP_CodeSniffer 3.x, so a
  # PHPCS 4 update cannot be resolved and failed the whole Dependabot run.
  # Patch and minor 3.x updates still come through.
  ignore:
  - dependency-name: squizlabs/php_codesniffer
    update-types:
    - version-update:semver-major
  schedule:
    interval: weekly
    day: monday
    time: 05:00
    timezone: Europe/Vilnius
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - security
  commit-message:
    prefix: ci
  cooldown:
    default-days: 7
