version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 05:00
    timezone: Europe/Vilnius
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - security
  commit-message:
    prefix: ci
  cooldown:
    default-days: 7
- package-ecosystem: composer
  directory: /.github/linters
  schedule:
    interval: weekly
    day: monday
    time: 05:00
    timezone: Europe/Vilnius
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - security
  commit-message:
    prefix: ci
  cooldown:
    default-days: 7
